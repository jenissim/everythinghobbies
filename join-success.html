<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>You're In — Everything Hobbies</title>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4efe5;
      color: #171717;
      font-family: "Inter", sans-serif;

      display: flex;
      flex-direction: column;
    }

    header {
      padding: 25px 6vw;
      border-bottom: 1px solid rgba(23,23,23,0.12);
    }

    .wordmark {
      color: #171717;
      text-decoration: none;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.07em;
    }

    .wordmark span {
      font-family: "DM Serif Display", serif;
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 70px 20px;
    }

    .success {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 25px;

      color: #b52b20;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(60px, 10vw, 120px);
      line-height: 0.88;
      letter-spacing: -0.07em;
    }

    h1 em {
      font-family: "DM Serif Display", serif;
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    .message {
      max-width: 550px;
      margin: 35px auto 0;

      color: #55524c;

      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;

      margin-top: 40px;
      padding: 18px 30px;

      background: #b52b20;
      color: white;

      text-decoration: none;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      transition: 0.2s ease;
    }

    .button:hover {
      background: #171717;
      transform: translateY(-2px);
    }

    footer {
      padding: 30px 20px;

      background: #171717;
      color: #99958f;

      text-align: center;

      font-size: 11px;
    }

    @media (max-width: 600px) {

      header {
        padding: 20px;
      }

      .wordmark {
        font-size: 21px;
      }

      main {
        padding: 50px 20px;
      }

      h1 {
        font-size: 65px;
      }

      .message {
        font-size: 16px;
      }

    }

  </style>
</head>

<body>

  <header>

    <a
      class="wordmark"
      href="index.html"
    >
      everything<span>hobbies</span>
    </a>

  </header>


  <main>

    <section class="success">

      <p class="eyebrow">
        You're officially in
      </p>

      <h1>
        Welcome to<br>
        <em>Everything Hobbies.</em>
      </h1>

      <p class="message">
        You're on the list. We'll be in touch with launch news,
        book club updates, conversations, and all the good things
        we're building.
      </p>

      <a
        class="button"
        href="index.html"
      >
        Back to Everything Hobbies →
      </a>

    </section>

  </main>


  <footer>
    Everything you love. Worth talking about.
  </footer>

</body>
</html>
